name: C
keywords:
  - auto
  - break
  - case
  - char
  - const
  - continue
  - default
  - do
  - double
  - else
  - enum
  - extern
  - float
  - for
  - goto
  - if
  - inline
  - int
  - long
  - register
  - restrict
  - return
  - short
  - signed
  - sizeof
  - static
  - struct
  - switch
  - typedef
  - union
  - unsigned
  - void
  - volatile
  - while
  - _Bool
  - _Alignas
  - _Alignof
  - _Atomic
  - _Complex
  - _Generic
  - _Imaginary
  - _Noreturn
  - _Static_assert
  - _Thread_local
  - _Pragma
  - alignas
  - alignof
  - bool
  - constexpr
  - static_assert
  - thread_local
  - typeof
  - typeof_unqual
builtins:
  - printf
  - fprintf
  - sprintf
  - scanf
  - malloc
  - calloc
  - realloc
  - free
  - memcpy
  - memset
  - strlen
  - strcmp
  - strcpy
  - fopen
  - fclose
  - size_t
  - FILE
  - uint8_t
  - uint16_t
  - uint32_t
  - uint64_t
  - int8_t
  - int16_t
  - int32_t
  - int64_t
literals:
  - "true"
  - "false"
  - "NULL"
  - "nullptr"
word_rules:
  - terminator: "("
    palette: function
    chars: ident
    max_len: 24
after_rules:
  - after: ["#"]
    palette: keyword
    chars: word
fsm_tokens:
  - start: "//"
    palette: comment
  - start: "/*"
    end: "*/"
    palette: comment
  - start: '"'
    end: '"'
    palette: string
  - start: "'"
    end: "'"
    palette: string
numbers: true
