name: Ruby
keywords:
  - def
  - end
  - if
  - elsif
  - else
  - unless
  - while
  - until
  - for
  - in
  - do
  - begin
  - rescue
  - ensure
  - raise
  - return
  - yield
  - class
  - module
  - self
  - super
  - and
  - or
  - not
  - then
  - case
  - when
  - break
  - next
  - redo
  - retry
  - lambda
  - proc
  - require
  - require_relative
  - include
  - extend
  - attr_accessor
  - attr_reader
  - attr_writer
  - new
  - alias
  - undef
  - defined
  - BEGIN
  - END
builtins:
  - puts
  - print
  - p
  - gets
  - loop
  - Integer
  - String
  - Array
  - Hash
  - Symbol
  - Float
  - Struct
  - Object
  - Kernel
  - Enumerable
  - File
  - Dir
  - Time
literals:
  - "true"
  - "false"
  - "nil"
word_rules:
  - terminator: "("
    palette: function
    chars: ident
    max_len: 24
after_rules:
  - after: ["."]
    palette: function
    chars: ident
    not_after: "0123456789"
  - after: ["@@"]
    palette: builtin
    chars: ident
  - after: ["@"]
    palette: builtin
    chars: ident
  - after: ["$"]
    palette: builtin
    chars: ident
fsm_tokens:
  - start: "#"
    palette: comment
  - start: '"'
    end: '"'
    palette: string
    interpolation:
      open: '#{'
      close: '}'
  - start: "'"
    end: "'"
    palette: string
numbers: true
