word_rules:
  - terminator: "("
    palette: function
    chars: letters
    max_len: 24
fsm_tokens:
  - start: "--"
    palette: comment
  - start: "/*"
    end: "*/"
    palette: comment
  - start: "'"
    end: "'"
    palette: string
  - start: '"'
    end: '"'
    palette: string
numbers: true
