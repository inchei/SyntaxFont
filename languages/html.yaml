name: HTML
word_rules:
  - terminator: "="
    palette: attr
    chars: word
    max_len: 30
after_rules:
  - after: ["<!DOCTYPE ", "<!doctype "]
    palette: attr
    chars: word
  - after: ["<!"]
    palette: tag
    chars: word
  - after: ["<"]
    palette: tag
    chars: word
  - after: ["</"]
    palette: tag
    chars: word
  - after: ["&"]
    palette: string
    chars: word
  - after: ["&#x", "&#X"]
    palette: string
    chars: "0123456789abcdefABCDEF"
  - after: ["&#"]
    palette: string
    chars: digits
fsm_tokens:
  - start: "<!--"
    end: "-->"
    palette: comment
  - start: '"'
    end: '"'
    palette: string
  - start: "'"
    end: "'"
    palette: string
numbers: false
