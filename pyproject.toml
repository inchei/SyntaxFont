[project]
name = "SyntaxFont"
version = "0.1.0"
description = "Build a font with built-in syntax highlighting (COLR + calt) from any base font, language rules and theme"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fonttools[woff]>=4.53",
    "pyyaml>=6.0",
    "uharfbuzz>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "brotli>=1.1"]

[project.scripts]
syntaxfont = "syntaxfont.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntaxfont"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "tests/coverage_sources"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is left to the formatter (long URLs, test names)
]

[tool.ruff.lint.per-file-ignores]
"scripts/build_web.py" = ["E402", "I001"]  # imports intentionally after sys.path bootstrap
"tests/**" = ["SIM115"]                    # module-level fixture reads

[tool.ruff.format]
quote-style = "double"
